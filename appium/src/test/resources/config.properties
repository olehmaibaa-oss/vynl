# VYNL Appium test configuration.
#
# Every key here can be overridden from the command line without editing this
# file, e.g.  mvn test -Dios.udid=A0EC2CC4-88A7-423A-B851-C59705474E84
#
# --- Appium server ---
appium.url=http://127.0.0.1:4723

# --- Device under test ---
# ios.udid=auto  -> use whichever simulator is currently booted.
# Set an explicit UDID when more than one simulator is booted at a time.
ios.deviceName=iPhone 17 Pro Max
ios.platformVersion=26.5
ios.udid=auto
ios.bundleId=dev.vynl

# --- WebDriverAgent ---
# The first WDA build exceeds the default timeout, hence the generous values.
# useNewWDA forces a rebuild each run; set it to false once things are stable
# to make runs noticeably faster.
wda.launchTimeoutMs=240000
wda.connectionTimeoutMs=240000
wda.useNewWDA=true
wda.usePrebuiltWDA=false

# --- Waits ---
# element: how long to wait for something expected to appear.
# absence: how long to wait before concluding something is NOT there. Kept
# short on purpose — negative checks paid at the element timeout make a suite
# crawl.
wait.elementTimeoutSec=10
wait.absenceTimeoutSec=2
